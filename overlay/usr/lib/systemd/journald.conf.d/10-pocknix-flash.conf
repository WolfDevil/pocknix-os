# Bound the journal, the largest single writer to the flash.
# Arch ships /var/log/journal and our journald.conf is stock, so journald is persistent and falls
# back to its built-in cap of 10% of the filesystem (up to 4 GB). Kept persistent rather than
# ROCKNIX's volatile /var tmpfs: pocknix-diag and bug reports need logs to survive a reboot.
[Journal]
SystemMaxUse=64M
RuntimeMaxUse=16M
# Size alone lets old entries sit on the card indefinitely.
MaxRetentionSec=1week
